name: StockPro CI/CD Pipeline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-project:
    name: Contrôle du projet
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Exécuter le script de contrôle
        run: ./scripts/check-project.sh

  test:
    name: Backend Lint & Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: stockpro_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: server

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le style et la qualité (ESLint)
        run: npm run lint

      - name: Générer un secret JWT éphémère
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Exécuter les tests avec couverture et rapport XML
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ''
          DB_NAME: stockpro_test
          JEST_JUNIT_OUTPUT_DIR: .
          JEST_JUNIT_OUTPUT_NAME: report.xml
        run: npm test -- --coverage --reporters=default --reporters=jest-junit

      - name: Conserver le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-node-${{ matrix.node }}
          path: server/report.xml
          if-no-files-found: warn

  frontend:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le style de code (ESLint)
        run: npm run lint

      - name: Compiler pour la production (Vite Build)
        env:
          VITE_API_URL: /api
        run: npm run build

  docker-build:
    name: Build des images Docker
    needs: [check-project, test, frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image de l'API
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: false
          tags: stockpro-api:ci

      - name: Construire l'image du frontend
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: false
          tags: stockpro-web:ci
